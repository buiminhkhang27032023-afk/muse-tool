<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triều Đình Rồng Tiên</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,500;0,600;0,700;0,900;1,600&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* layout: toàn màn hình là thế giới 3D; HUD nổi ở góc; bấm vào vật thể thì mở ngăn kéo bên phải */
:root{
  --bg:#f3e7d8; --surface:#fffaf4; --surface2:#ede0cd; --ink:#2a1a14; --muted:#7c6552;
  --son:#9c2b2b; --son-ink:#fff6ec; --gold:#a97a26; --jade:#2f5d50; --line:rgba(42,26,20,.16);
  --warn:#b9711f; --info:#3b6ea5; --prog:#7a4fa0; --ok:#2f7a55;
  --glass:rgba(255,250,244,.9); --glass-line:rgba(42,26,20,.14);
  --shadow:0 12px 34px -14px rgba(42,26,20,.5);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1b120e; --surface:#241a14; --surface2:#2d2119; --ink:#f3e6d6; --muted:#b9a390;
    --son:#d9534f; --son-ink:#fff6ec; --gold:#d9ab57; --jade:#5a9d87; --line:rgba(243,230,214,.16);
    --warn:#d99a3f; --info:#6f9fd4; --prog:#a888cf; --ok:#5fb386;
    --glass:rgba(32,23,18,.88); --glass-line:rgba(243,230,214,.16);
    --shadow:0 12px 38px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b120e; --surface:#241a14; --surface2:#2d2119; --ink:#f3e6d6; --muted:#b9a390;
  --son:#d9534f; --son-ink:#fff6ec; --gold:#d9ab57; --jade:#5a9d87; --line:rgba(243,230,214,.16);
  --warn:#d99a3f; --info:#6f9fd4; --prog:#a888cf; --ok:#5fb386;
  --glass:rgba(32,23,18,.88); --glass-line:rgba(243,230,214,.16);
  --shadow:0 12px 38px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%; margin:0; overflow:hidden}
body{background:var(--bg); color:var(--ink); font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px}
h1,h2,h3,h4{font-family:"Noto Serif Display",Georgia,serif; text-wrap:balance; margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

.stage{position:fixed; inset:0; background:#241533; overflow:hidden}
#san3d-canvas-holder{position:absolute; inset:0}
#san3d-canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab; outline:none}
#san3d-canvas:active{cursor:grabbing}
.glass{background:var(--glass); border:1px solid var(--glass-line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:var(--shadow)}

/* HUD */
.hud{position:absolute; z-index:3; pointer-events:none}
.hud > *{pointer-events:auto}
.brand{left:max(12px, env(safe-area-inset-left)); top:max(12px, env(safe-area-inset-top)); display:flex; flex-direction:column; gap:8px}
.brand .tit{padding:9px 14px; border-radius:14px}
.brand small{display:block; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700}
.brand h1{font-size:clamp(18px,3.2vw,26px); color:var(--son); line-height:1.1; margin-top:2px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{border:1px solid var(--glass-line); background:var(--glass); backdrop-filter:blur(8px); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer; display:flex; gap:6px; align-items:center; box-shadow:var(--shadow)}
.chip b{font-family:"Noto Serif Display",serif; font-size:15px; font-variant-numeric:tabular-nums}
.chip.cho b{color:var(--warn)} .chip.lam b{color:var(--prog)} .chip.xong b{color:var(--ok)}
.chip.nut{background:var(--son); color:var(--son-ink); border-color:var(--son)}
.chip:hover{border-color:var(--gold)}

.tod{right:max(12px, env(safe-area-inset-right)); top:max(12px, env(safe-area-inset-top)); display:flex; gap:4px; padding:4px; border-radius:999px}
.tod button{border:none; background:transparent; color:var(--ink); font:600 12px "Be Vietnam Pro",sans-serif; padding:6px 12px; border-radius:999px; cursor:pointer}
.tod button.on{background:var(--gold); color:#241613}

.hint{left:max(12px, env(safe-area-inset-left)); bottom:calc(max(12px, env(safe-area-inset-bottom)) + 52px); font-size:11px; color:#f3e6d6; background:rgba(20,12,30,.55); padding:5px 12px; border-radius:999px; pointer-events:none !important; max-width:min(560px, calc(100vw - 200px))}
.places{left:max(12px, env(safe-area-inset-left)); right:calc(max(12px, env(safe-area-inset-right)) + 164px); bottom:max(12px, env(safe-area-inset-bottom)); display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:thin}
.places button{flex:0 0 auto; border:1px solid var(--glass-line); background:var(--glass); backdrop-filter:blur(8px); color:var(--ink); border-radius:999px; padding:6px 12px; font:600 12px "Be Vietnam Pro",sans-serif; cursor:pointer; white-space:nowrap}
.places button:hover{border-color:var(--gold)}
#san3d-map{position:absolute; z-index:3; right:max(12px, env(safe-area-inset-right)); bottom:max(12px, env(safe-area-inset-bottom)); width:150px; height:150px; border-radius:14px; border:1px solid rgba(255,255,255,.28); cursor:pointer; background:#222; box-shadow:var(--shadow)}
.san3d-full{position:absolute; z-index:3; right:calc(max(12px, env(safe-area-inset-right)) + 158px); bottom:max(12px, env(safe-area-inset-bottom)); width:32px; height:32px; border:none; border-radius:9px; background:rgba(20,12,30,.65); color:#f3e6d6; font-size:16px; cursor:pointer}
.san3d-tip{position:absolute; z-index:6; pointer-events:none; background:rgba(20,12,30,.9); color:#f6ece1; font-size:12px; padding:4px 10px; border-radius:8px; white-space:nowrap}
.san3d-loading{position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center; color:#f3e6d6; font-size:14px; background:rgba(20,12,30,.7)}
.san3d-pad{display:none; position:absolute; z-index:3; left:max(12px, env(safe-area-inset-left)); bottom:calc(max(12px, env(safe-area-inset-bottom)) + 96px); grid-template-columns:repeat(3,40px); gap:4px}
.san3d-pad button{height:40px; border:none; border-radius:10px; background:rgba(20,12,30,.62); color:#f3e6d6; font-size:14px; touch-action:none}
@media (pointer:coarse){.san3d-pad{display:grid} .hint{display:none}}

/* ngăn kéo thông tin */
.drawer{position:absolute; z-index:5; right:max(12px, env(safe-area-inset-right)); top:calc(max(12px, env(safe-area-inset-top)) + 54px); bottom:calc(max(12px, env(safe-area-inset-bottom)) + 168px); width:min(430px, calc(100vw - 24px)); border-radius:18px; display:flex; flex-direction:column; overflow:hidden}
.drawer[hidden]{display:none}
.drawer-head{padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start}
.drawer-head .t{flex:1; min-width:0}
.drawer-head h2{font-size:19px; color:var(--son)}
.drawer-head small{color:var(--muted); font-size:12px}
.x{border:none; background:var(--surface2); color:var(--ink); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; flex:0 0 auto}
.drawer-body{padding:12px 16px 18px; overflow-y:auto; flex:1; min-height:0}
@media (max-width:700px){
  .drawer{left:8px; right:8px; top:auto; bottom:calc(max(8px, env(safe-area-inset-bottom)) + 56px); width:auto; max-height:58vh}
  .places{right:max(12px, env(safe-area-inset-right))} #san3d-map{display:none} .san3d-full{display:none}
  .brand h1{font-size:15px}
  .brand small{display:none}
  .brand .tit{padding:7px 12px; max-width:calc(100vw - 168px)}
  .tod button{padding:6px 8px; font-size:11px}
  .chip{padding:5px 9px; font-size:11px}
}

/* thành phần trong ngăn kéo */
.sec{margin:14px 0 6px; font:700 11px "Be Vietnam Pro",sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--gold)}
.sec:first-child{margin-top:2px}
p.m{margin:6px 0; color:var(--muted); font-size:12.5px; line-height:1.5}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.kpi{padding:9px 10px; border-radius:12px; background:var(--surface2); text-align:left}
.kpi b{display:block; font-family:"Noto Serif Display",serif; font-size:21px; font-variant-numeric:tabular-nums; color:var(--son)}
.kpi span{font-size:10.5px; color:var(--muted)}
.item{padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:8px}
.item h5{margin:0 0 3px; font-size:13.5px}
.item .meta{font-size:11.5px; color:var(--muted); margin-bottom:7px}
.item .row{display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:space-between}
.pill{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap}
.pill.cho_duyet{background:color-mix(in srgb, var(--warn) 22%, transparent); color:var(--warn)}
.pill.da_duyet{background:color-mix(in srgb, var(--info) 22%, transparent); color:var(--info)}
.pill.dang_lam{background:color-mix(in srgb, var(--prog) 22%, transparent); color:var(--prog)}
.pill.hoan_thanh{background:color-mix(in srgb, var(--ok) 22%, transparent); color:var(--ok)}
.btn{border:1px solid var(--line); background:var(--surface2); color:var(--ink); padding:6px 12px; border-radius:9px; font:600 12px "Be Vietnam Pro",sans-serif; cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.chinh{background:var(--son); color:var(--son-ink); border-color:var(--son)}
.btn.ngoc{background:var(--jade); color:#fff; border-color:var(--jade)}
.btn.nho{padding:4px 9px; font-size:11px}
.empty{padding:14px 10px; text-align:center; color:var(--muted); font-size:12px; font-style:italic}
form.f{display:flex; flex-direction:column; gap:8px; margin-top:6px}
form.f label{font-size:11px; color:var(--muted); font-weight:600; display:block; margin-bottom:3px}
form.f input, form.f select, form.f textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); font:inherit; font-size:13px}
form.f .two{display:flex; gap:8px} form.f .two > div{flex:1; min-width:0}
.feed{display:flex; flex-direction:column; gap:8px}
.line{padding:8px 11px; border-radius:11px; background:var(--surface2); font-size:12.5px; line-height:1.45}
.line time{display:block; font-size:10.5px; color:var(--muted); margin-top:2px}
.line b{color:var(--jade)}
.rost{display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:12px; cursor:pointer; border:1px solid transparent}
.rost:hover{background:var(--surface2); border-color:var(--line)}
.av{width:34px; height:34px; border-radius:50%; background:var(--son); color:var(--son-ink); display:flex; align-items:center; justify-content:center; font-family:"Noto Serif Display",serif; font-size:13px; border:2px solid var(--gold); flex:0 0 auto}
.rost .n{flex:1; min-width:0} .rost b{display:block; font-size:13px} .rost small{display:block; color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:#999; margin-right:5px}
.dot.on{background:var(--ok)} .dot.wait{background:var(--warn)}
.step{padding:9px 11px; border:1px solid var(--line); border-radius:11px; background:var(--surface); margin-bottom:7px; font-size:12.5px}
.step .who{font-size:11px; font-weight:700; margin-bottom:4px; display:flex; gap:6px; align-items:center}
.step .rep{white-space:pre-wrap; line-height:1.5}
.step.run{border-color:var(--prog)}
.ans{padding:10px 12px; border-radius:12px; background:color-mix(in srgb, var(--ok) 14%, var(--surface)); border:1px solid color-mix(in srgb, var(--ok) 40%, transparent); white-space:pre-wrap; line-height:1.55; font-size:13px}
code.cmd{font-family:ui-monospace,Consolas,monospace; font-size:11px; background:var(--surface2); padding:2px 6px; border-radius:6px; user-select:all}
details.d{margin:8px 0; border:1px dashed var(--line); border-radius:12px; padding:8px 10px}
details.d summary{cursor:pointer; font-weight:700; font-size:12.5px; color:var(--son)}
</style>
</head>
<body>
<div class="stage" id="san3d-wrap">
  <div id="san3d-canvas-holder"><canvas id="san3d-canvas" tabindex="0"></canvas></div>

  <div class="hud brand">
    <div class="tit glass">
      <small>Hoàng triều truyền thông · Con Rồng Cháu Tiên</small>
      <h1>Triều Đình Rồng Tiên</h1>
    </div>
    <div class="chips">
      <button class="chip cho" type="button" data-hud="vua"><b id="k-cho">0</b> chờ ngự phê</button>
      <button class="chip lam" type="button" data-hud="bang"><b id="k-lam">0</b> đang làm</button>
      <button class="chip xong" type="button" data-hud="bang"><b id="k-xong">0</b> hoàn thành</button>
      <button class="chip nut" type="button" data-hud="tongquan">Tổng quan</button>
      <button class="chip" id="muse-chip" type="button" data-hud="vua">🧠 Muse: …</button>
      <a class="chip" id="arena-link" href="/san-choi" data-muse-href="/san-choi" style="text-decoration:none; display:none">🎪 Sân chơi</a>
    </div>
  </div>

  <div class="hud tod glass san3d-tod"><button type="button" data-tod="day">Sáng</button><button type="button" data-tod="dusk">Chiều</button><button type="button" data-tod="night">Đêm</button></div>

  <div class="hud hint">WASD bay · Q/E xuống/lên · Shift chạy nhanh · Kéo chuột để nhìn · Cuộn tiến/lùi · Bấm vào quan, nhà, điện để mở việc</div>
  <div class="hud places" id="san3d-places"></div>
  <canvas id="san3d-map" width="150" height="150"></canvas>
  <button class="san3d-full" id="san3d-full" type="button" aria-label="Toàn màn hình">⛶</button>
  <div class="san3d-pad">
    <span></span><button type="button" data-key="KeyW">▲</button><span></span>
    <button type="button" data-key="KeyA">◀</button><button type="button" data-key="KeyS">▼</button><button type="button" data-key="KeyD">▶</button>
    <button type="button" data-key="KeyQ">⤓</button><span></span><button type="button" data-key="KeyE">⤒</button>
  </div>
  <div class="san3d-tip" id="san3d-tip" hidden></div>
  <div class="san3d-loading" id="san3d-loading"><span>Đang dựng ngôi làng…</span></div>

  <aside class="drawer glass" id="drawer" hidden>
    <div class="drawer-head">
      <div class="t"><h2 id="drawer-title"></h2><small id="drawer-sub"></small></div>
      <button class="btn nho chinh" id="drawer-fly" type="button">Bay tới</button>
      <button class="x" id="drawer-close" type="button" aria-label="Đóng">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</div>

<script>
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime = iso => { try { return new Date(iso).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };

const BO = [
  {key:'cong',  ten:'Công Bộ',  chucnang:'AI Làm Phim & Video', mota:'Dựng phim, dựng cảnh, tạo video bằng AI.'},
  {key:'le',    ten:'Lễ Bộ',    chucnang:'Xây Kênh',            mota:'Dựng kênh, gây thanh thế, kéo khán giả.'},
  {key:'ho',    ten:'Hộ Bộ',    chucnang:'Web & Ads Google',    mota:'Làm web, chạy quảng cáo Google, giữ ngân khố.'},
  {key:'binh',  ten:'Binh Bộ',  chucnang:'Ads Facebook',        mota:'Xuất chiến dịch, săn tin nhắn khách trên Facebook.'},
  {key:'hinh',  ten:'Hình Bộ',  chucnang:'Sale',                mota:'Xét duyệt khách, chốt deal, tâu việc sang các bộ.'},
  {key:'lai',   ten:'Lại Bộ',   chucnang:'Hậu Kỳ (Edit Video)', mota:'Nhận việc từ Lễ Bộ, Hình Bộ; hoàn thiện thành phẩm.'},
];
const BO_MAP = Object.fromEntries(BO.map(b=>[b.key,b]));
const QUAN = [
  {key:'cong',  ten:'Lý Vạn Tượng',    chuc:'Công Bộ Thượng Thư'},
  {key:'le',    ten:'Trịnh Ngọc Hương', chuc:'Lễ Bộ Thượng Thư'},
  {key:'ho',    ten:'Đặng Kim Bảng',   chuc:'Hộ Bộ Thượng Thư'},
  {key:'binh',  ten:'Vũ Thiết Phong',  chuc:'Binh Bộ Thượng Thư'},
  {key:'hinh',  ten:'Phạm Minh Quyết', chuc:'Hình Bộ Thượng Thư'},
  {key:'lai',   ten:'Ngô Tuấn Kiệt',   chuc:'Lại Bộ Thượng Thư'},
];
const TRANG_THAI = ['cho_duyet','da_duyet','dang_lam','hoan_thanh'];
const TEN_TT = {cho_duyet:'Chờ duyệt', da_duyet:'Đã duyệt', dang_lam:'Đang làm', hoan_thanh:'Hoàn thành'};
const NEXT_TT = {cho_duyet:'da_duyet', da_duyet:'dang_lam', dang_lam:'hoan_thanh'};
const NEXT_LABEL = {da_duyet:'Nhận việc', dang_lam:'Hoàn thành'};

let congVu = [], nhatKy = [], hoaVien = [], dbHandle = null;
const ini = t => t.split(' ').map(w => w[0]).slice(0, 2).join('');

async function setTrangThai(id, tt){
  const v = congVu.find(x => x.id === id); if(!v) return;
  v.trang_thai = tt; afterData();
  if(dbHandle){ try{ await dbHandle.collection('cong_vu').doc(id).update({trang_thai:tt}); }catch(e){} }
}
async function xoaViec(id){
  const i = congVu.findIndex(x => x.id === id); if(i < 0) return;
  congVu.splice(i, 1); afterData();
  if(dbHandle){ try{ await dbHandle.collection('cong_vu').doc(id).delete(); }catch(e){} }
}
async function themViec(v){
  const local = Object.assign({}, v, {id:'tmp-' + Date.now()});
  congVu.unshift(local); afterData();
  if(dbHandle){ try{ const ref = await dbHandle.collection('cong_vu').add(v); local.id = ref.id; }catch(e){} }
}
async function themNhatKy(n){
  nhatKy.unshift(n); afterData();
  if(dbHandle){ try{ await dbHandle.collection('nhat_ky').add(n); }catch(e){} }
}
async function themHoa(h){
  hoaVien.unshift(h); afterData();
  if(dbHandle){ try{ await dbHandle.collection('hoa_vien').add(h); }catch(e){} }
}

function afterData(){
  const dem = s => congVu.filter(v => v.trang_thai === s).length;
  document.getElementById('k-cho').textContent = dem('cho_duyet');
  document.getElementById('k-lam').textContent = dem('dang_lam');
  document.getElementById('k-xong').textContent = dem('hoan_thanh');
  if(window.UI) window.UI.refresh();
  if(window.san3dOnData) window.san3dOnData();
}


/* ---------- Muse: nối với tool trên máy (D:\tool muse, cổng 5000) ---------- */
const AGN = {chu:['Chủ Nhân','#c0392b'], noicac:['Bệ Hạ','#b3202c'], cong:['Công Bộ','#5b7fb5'], le:['Lễ Bộ','#c0568a'], ho:['Hộ Bộ','#3f9e74'], binh:['Binh Bộ','#d3722f'], hinh:['Hình Bộ','#7d5bb0'], lai:['Lại Bộ','#c79a35']};
const KIND_TXT = {giao:'nhận việc', hoi:'được hỏi', tra_loi:'hoàn thiện', chia_viec:'chia việc', tong_hop:'tổng hợp'};
const MUSE = {labels:{}, base:null, online:false, tabs:[], runs:[], viewRun:null, hash:''};
const acctLine = k => '<p class="m"><span class="dot ' + (MUSE.tabs.indexOf(k) >= 0 ? 'on' : '') + '"></span>Tài khoản Muse: ' + (MUSE.tabs.indexOf(k) >= 0 ? '<b>' + esc((MUSE.labels[k] || []).join(', ')) + '</b>' : 'chưa gán (dùng tab tự do)') + '</p>';
const boName = k => (BO_MAP[k] ? BO_MAP[k].ten : (k === 'noicac' || k === '' || !k ? 'Bệ Hạ' : '?'));
const viecOf = s => { const a = String(s.ask || ''); if(s.kind === 'hoi') return a.split('\n')[0].replace(/^.*?hỏi bạn:\s*/, '').trim(); const i = a.indexOf('\n'); const j = a.indexOf('\n\n', i + 1); return (i >= 0 ? a.slice(i + 1, j > 0 ? j : undefined) : a).replace(/\s+/g, ' ').trim(); };
const ON_ARTIFACT = !!window.claude;   // bản đăng trên claude.ai: trình duyệt chặn mọi kết nối ra ngoài
const MUSE_BASE = (typeof window.__MUSE_BASE__ === 'string' ? window.__MUSE_BASE__ : '');
(function(){ var a=document.getElementById('arena-link'); if(a){ a.setAttribute('href', MUSE_BASE + '/san-choi'); } })();
function museBases(){
  if(ON_ARTIFACT) return [];
  if(/^https?:$/.test(location.protocol)) return [MUSE_BASE];  // same origin under /muse
  return [MUSE_BASE || 'http://127.0.0.1:5000', 'http://localhost:5000'];
}
function museLoginNext(){
  // next is path relative to the Flask app (no /muse), so login redirect stays inside Passenger mount
  let p = location.pathname || '/';
  if(MUSE_BASE && p.startsWith(MUSE_BASE)) p = p.slice(MUSE_BASE.length) || '/';
  return p;
}
async function museGet(base, path, opt){
  if(ON_ARTIFACT) throw new Error('claude.ai chặn kết nối ngoài');
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 2500);
  try { const r = await fetch(base + path, Object.assign({signal:ctl.signal}, opt || {})); if(r.status === 401){ location.href = MUSE_BASE + '/login?next=' + encodeURIComponent(museLoginNext()); } return {ok:r.ok, status:r.status, data:await r.json()}; }
  finally { clearTimeout(to); }
}
async function musePoll(){
  try {
    if(MUSE.base === null){
      for(const b of museBases()){ try { const r = await museGet(b, '/api/status'); if(r.ok){ MUSE.base = b; break; } } catch(e){} }
    }
    if(MUSE.base !== null){
      const st = await museGet(MUSE.base, '/api/status'), rs = await museGet(MUSE.base, '/api/court/runs');
      MUSE.online = !!st.data.bridge_connected; MUSE.tabs = st.data.agents || []; MUSE.tabCount = st.data.tab_count || 0; MUSE.labels = st.data.labels || {}; MUSE.runs = rs.data || [];
    }
  } catch(e){ MUSE.base = null; MUSE.online = false; MUSE.tabs = []; }
  const h = JSON.stringify([MUSE.base === null, MUSE.online, MUSE.tabs, MUSE.labels, MUSE.runs]);
  if(h !== MUSE.hash){
    MUSE.hash = h; museChip(); syncMuseJobs();
    if(window.san3dOnMuse) window.san3dOnMuse(MUSE.runs);
  }
  setTimeout(musePoll, MUSE.base === null ? 4000 : 1200);
}
function museChip(){
  const c = document.getElementById('muse-chip'); if(!c) return;
  c.innerHTML = '<span class="dot ' + (MUSE.online ? 'on' : (MUSE.base !== null ? 'wait' : '')) + '"></span>Muse: ' + (MUSE.base === null ? (ON_ARTIFACT ? 'mở bản tên miền để dùng' : 'tool chưa chạy') : (MUSE.online ? (MUSE.tabCount || MUSE.tabs.length) + ' tab nối' : 'chờ tab muse.ai'));
}
function syncMuseJobs(){
  const out = [];
  MUSE.runs.slice(0, 4).forEach(r => r.steps.forEach(s => {
    if(s.kind !== 'giao' && s.kind !== 'hoi') return;
    const st = s.status === 'done' ? 'hoan_thanh' : (s.status === 'running' ? 'dang_lam' : null); if(!st) return;
    out.push({id:'muse-' + s.id, tieu_de:boName(s.to) + ': ' + viecOf(s).slice(0, 80), bo_giao:s.from === 'chu' ? '' : s.from, bo_nhan:s.to, ghi_chu:'qua Muse', trang_thai:st, created_at:new Date(s.ts*1000).toISOString(), local:true});
  }));
  congVu = congVu.filter(v => !v.local).concat(out);
  afterData();
}
async function museAsk(question, to){
  if(MUSE.base === null) return 'Tool Muse chưa chạy. Mở D:\\tool muse\\run.bat rồi thử lại.';
  try {
    const r = await museGet(MUSE.base, '/api/court/ask', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:question, to:to})});
    if(!r.ok) return r.data.error || 'Lỗi';
    MUSE.viewRun = r.data.id; MUSE.hash = ''; return '';
  } catch(e){ return 'Không nối được tool Muse.'; }
}
async function museCancel(id){ try { await museGet(MUSE.base, '/api/court/cancel/' + id, {method:'POST'}); MUSE.hash = ''; } catch(e){} }

  function view(){
    const d = cur, bo = d.key ? BO_MAP[d.key] : null, q = d.key ? QUAN.find(x => x.key === d.key) : null;
    switch(d.type){
      case 'tongquan':
        return {t:'Tổng quan triều đình', s:'Bệ hạ xem toàn cảnh công vụ', fly:false, h:kpis() + '<div class="sec">Sớ chờ ngự phê</div>' + pendingList() + '<div class="sec">Quan lại</div>' + roster() + '<div class="sec">Công vụ gần đây</div>' + (congVu.slice(0, 5).map(jobCard).join('') || '<div class="empty">Chưa có công vụ.</div>')};

      case 'quan': {

        return {t:q.ten, s:q.chuc + ' · ' + bo.chucnang, fly:true, h:'<p class="m">' + esc(bo.mota) + '</p>' + acctLine(d.key) + '<div class="grid4"><div class="kpi"><b>' + dang.length + '</b><span>Đang làm</span></div><div class="kpi"><b>' + cho.length + '</b><span>Chờ duyệt</span></div></div>' + '<div class="sec">Việc đang làm</div>' + (dang.length ? dang.map(jobCard).join('') : '<div class="empty">Chưa có việc đang làm.</div>') + '<div class="sec">Nhật ký</div>' + feed(d.key, 10) + tauForm(d.key) + '<div class="sec">Nhà bộ</div><button class="btn" data-act="open" data-type="bo" data-key="' + d.key + '" type="button">Mở ' + esc(bo.ten) + '</button>'};
      }
      case 'hoavien': {
        const posts = hoaVien.slice(0, 30).map(h => '<div class="line"><b>' + esc(h.tac_gia) + '</b>: ' + esc(h.noi_dung) + '<time>' + fmtTime(h.created_at) + '</time></div>').join('') || '<div class="empty">Chưa ai dán gì lên tường hoa. Hãy là người đầu tiên.</div>';
        return {t:'Ngự Hoa Viên', s:'Khu giải trí · trà dư tửu hậu', fly:true, h:'<p class="m">Hồ sen, thủy đình, nhà múa rối nước. Khen thưởng, đùa vui, chuyện ngoài công vụ của cả triều.</p><form class="f" data-form="hoa"><div class="two"><div><label>Tên</label><input name="tac_gia" required maxlength="40" placeholder="Tên của ngài"></div></div><div><label>Lời nhắn</label><input name="noi_dung" required maxlength="240" placeholder="Có chuyện gì hay kể triều đình nghe..."></div><button class="btn ngoc" type="submit">Dán lên tường hoa</button></form><div class="sec">Tường hoa</div><div class="feed">' + posts + '</div>'};
      }
      case 'place': {
        const info = window.san3dApi ? window.san3dApi.placeInfo(d.key) : null;
        return {t:info ? info.ten : 'Địa điểm', s:'Địa điểm trong làng', fly:true, h:'<p class="m">' + esc(info ? info.mota : '') + '</p>'};
      }

        return {t:d.ten || 'Dân làng', s:'Người trong làng', fly:true, h:'<p class="m">' + esc(d.mota || '') + '</p>'};
    }
    return {t:'', s:'', fly:false, h:''};

  function render(){
    if(!cur) return;
    const keep = {}; let focusName = null, focusPos = 0;
    body.querySelectorAll('input[name],textarea[name],select[name]').forEach(el => { if(el.type !== 'hidden'){ keep[el.name + '|' + (el.closest('form') ? el.closest('form').dataset.form : '')] = el.value; if(document.activeElement === el){ focusName = el.name + '|' + el.closest('form').dataset.form; focusPos = el.selectionStart || 0; } } });
    const openDetails = Array.from(body.querySelectorAll('details')).map(d => d.open);
    const sc = body.scrollTop;
    const v = view();
    title.textContent = v.t; sub.textContent = v.s; flyBtn.hidden = !v.fly;
    body.innerHTML = v.h;
    body.querySelectorAll('details').forEach((d, i) => { if(openDetails[i]) d.open = true; });
    body.querySelectorAll('input[name],textarea[name],select[name]').forEach(el => { const k = el.name + '|' + (el.closest('form') ? el.closest('form').dataset.form : ''); if(el.type !== 'hidden' && keep[k] !== undefined) el.value = keep[k]; if(k === focusName){ el.focus(); try{ el.setSelectionRange(focusPos, focusPos); }catch(e){} } });
    body.scrollTop = sc;
  }
  function open(d){ cur = d; drawer.hidden = false; body.scrollTop = 0; render(); }
  function close(){ cur = null; drawer.hidden = true; if(window.san3dApi) window.san3dApi.clearSelect(); }

  body.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b || b.tagName === 'SELECT') return;
    const a = b.dataset.act, id = b.dataset.id;
    if(a === 'duyet') setTrangThai(id, 'da_duyet');
    else if(a === 'boc') xoaViec(id);
    else if(a === 'next') setTrangThai(id, b.dataset.next);
    else if(a === 'huy') museCancel(id);
    else if(a === 'run'){ MUSE.viewRun = id; render(); }
    else if(a === 'open'){ const t = b.dataset.type, k = b.dataset.key; open({type:t, key:k}); if(window.san3dApi) window.san3dApi.selectKey(t, k); }
  });
  body.addEventListener('change', e => { const s = e.target.closest('select[data-act="loc"]'); if(s && cur){ cur.loc = s.value; render(); } });
  body.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, fd = new FormData(f), t = f.dataset.form;
    if(t === 'chi'){
      const q = (fd.get('question') || '').trim(); if(!q) return;
      museAsk(q, fd.get('to') || 'auto').then(err => { const el = body.querySelector('#chi-err'); if(err){ if(el) el.textContent = err; } else { f.reset(); } if(window.UI) window.UI.refresh(); });
      return;

      let last = '';

        try {
          const r = need(await fetch(MUSE_BASE + '/api/db/' + name)), arr = await r.json(), h = JSON.stringify(arr);
          if(h !== last){ last = h; cb({docs:arr.map(o => ({id:o.id, data:() => { const c = Object.assign({}, o); delete c.id; return c; }}))}); }
        } catch(e){ if(err) err(e); }

function fasciaGeo(hw, hd, H, flick, rf){
  const key = [hw, hd, H, flick, rf].join('_');

  const hf = (x, z) => {

function ribbon(points, width, mat, y, uvScale){
  const curve = new THREE.CatmullRomCurve3(points.map(p => new V3(p[0], 0, p[1])), false, 'catmullrom', 0.5);
  const n = Math.max(24, Math.floor(curve.getLength()/1.2));
  const pos = [], nor = [], uv = [], idx = [];

  for(let i = 0; i <= n; i++){

    pos.push(pt.x - wx, y, pt.z - wz, pt.x + wx, y, pt.z + wz);
    nor.push(0,1,0, 0,1,0);
    if(prev) dist += pt.distanceTo(prev);
    prev = pt;
    uv.push(0, dist/uvScale, 1, dist/uvScale);
    if(i < n){ const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }

  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  const mesh = new THREE.Mesh(g, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);
  return {mesh:mesh, curve:curve};
}

function buildMountains(){
  const colorAt = (t, snow) => {
    const c = new THREE.Color();
    if(t < 0.28) c.setHex(0x2f5a3a).lerp(new THREE.Color(0x4a6b45), t/0.28);
    else if(t < 0.6) c.setHex(0x4a6b45).lerp(new THREE.Color(0x77786f), (t-0.28)/0.32);
    else if(t < snow) c.setHex(0x77786f).lerp(new THREE.Color(0x9b9aa0), (t-0.6)/(snow-0.6));
    else c.setHex(0xeceae6);
    return c;
  };
  const make = (x, z, rad, h, snow, seg) => {
    if(Math.hypot(x - 64, z + 5) < rad + 24) return null;
    const geo = new THREE.ConeGeometry(rad, h, seg, 7, true);
    const p = geo.attributes.position, cols = [];
    for(let i = 0; i < p.count; i++){
      const px = p.getX(i), py = p.getY(i), pz = p.getZ(i);
      const t = (py + h/2)/h;
      if(t < 0.985){
        const j = (1 - t)*0.3 + 0.1;
        p.setX(i, px + (hash3(px, py, pz) - 0.5)*rad*j);
        p.setZ(i, pz + (hash3(pz, py, px) - 0.5)*rad*j);
        p.setY(i, py + (hash3(py, px, pz) - 0.5)*h*0.07);
      }
      const c = colorAt(t, snow);
      cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:1}));
    m.position.set(x, h/2 - 1.5, z);
    m.rotation.y = rnd()*6.28;
    scene.add(m);
    return m;
  };
  const N = 30;
  for(let i = 0; i < N; i++){
    const a = i/N*Math.PI*2 + rr(-0.06, 0.06), r = rr(105, 135);
    const h = rr(42, 82), rad = rr(26, 40);
    make(Math.sin(a)*r, Math.cos(a)*r + 4, rad, h, h > 66 ? 0.86 : 0.99, 8 + (i % 3));
  }
  for(let i = 0; i < 24; i++){
    const a = i/24*Math.PI*2 + rr(-0.1, 0.1), r = rr(84, 100);
    const h = rr(14, 26), rad = rr(14, 22);
    make(Math.sin(a)*r, Math.cos(a)*r + 4, rad, h, 1.2, 8);
  }
  const hero = make(-60, -52, 30, 70, 0.84, 9);
  return hero;
}

function buildForest(avoid){
  const clear = (x, z) => {
    for(const a of avoid){ if(Math.hypot(x - a[0], z - a[1]) < a[2]) return false; }
    return true;
  };
  const pineTrunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.18, 0.26, 2.4, 6), M(0x4a3322), 260);
  const pineA = new THREE.InstancedMesh(new THREE.ConeGeometry(1.7, 3.2, 7), M(0x2c5a34, {flatShading:true}), 260);
  const pineB = new THREE.InstancedMesh(new THREE.ConeGeometry(1.2, 2.6, 7), M(0x33683b, {flatShading:true}), 260);
  const roundTrunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.2, 0.3, 2.0, 6), M(0x5a4030), 160);
  const roundTop = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.7, 0), M(0x4a7a3a, {flatShading:true}), 160);
  const tmp = new THREE.Object3D();
  let pi = 0, ri = 0, tries = 0;
  while((pi < 260 || ri < 160) && tries++ < 4000){
    const a = rnd()*Math.PI*2, r = rr(46, 92);
    const x = Math.sin(a)*r, z = Math.cos(a)*r;
    if(z > 8 && z < 84 && Math.abs(x) < 80) continue;
    if(!clear(x, z)) continue;
    const s = rr(0.8, 1.7);
    if(rnd() > 0.38 && pi < 260){
      tmp.position.set(x, 1.2*s, z); tmp.rotation.set(0, rnd()*6, 0); tmp.scale.setScalar(s); tmp.updateMatrix(); pineTrunk.setMatrixAt(pi, tmp.matrix);
      tmp.position.set(x, 3.4*s, z); tmp.updateMatrix(); pineA.setMatrixAt(pi, tmp.matrix);
      tmp.position.set(x, 5.2*s, z); tmp.updateMatrix(); pineB.setMatrixAt(pi, tmp.matrix);
      pi++;
    } else if(ri < 160){
      tmp.position.set(x, 1.0*s, z); tmp.rotation.set(0, rnd()*6, 0); tmp.scale.setScalar(s); tmp.updateMatrix(); roundTrunk.setMatrixAt(ri, tmp.matrix);
      tmp.position.set(x, 3.0*s, z); tmp.updateMatrix(); roundTop.setMatrixAt(ri, tmp.matrix);
      ri++;
    }
  }
  [[pineTrunk, pi], [pineA, pi], [pineB, pi], [roundTrunk, ri], [roundTop, ri]].forEach(([m, n]) => {
    m.count = n; m.instanceMatrix.needsUpdate = true; scene.add(m);
  });
}

function rrect(g, x, y, w, h, r){

  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();

function makeLabelSprite(text, accent, small){

/* ---------- walls ---------- */
let brickBase;
function brickMat(rx, ry){
  if(!brickBase){
    brickBase = canvasTex(128, 128, (c, w, h) => {
      c.fillStyle = '#9a8f7c'; c.fillRect(0, 0, w, h);
      c.strokeStyle = 'rgba(40,30,20,0.5)'; c.lineWidth = 2;
      for(let j = 0; j < 8; j++){
        const y = j*16; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
        const off = (j % 2)*16;
        for(let i = 0; i < 5; i++){ c.beginPath(); c.moveTo(off + i*32, y); c.lineTo(off + i*32, y + 16); c.stroke(); }
      }
      for(let i = 0; i < 320; i++){ c.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.07)'; c.fillRect(rnd()*w, rnd()*h, 3, 3); }
    });
  }
  const t = brickBase.clone(); t.needsUpdate = true; t.repeat.set(Math.max(1, rx), Math.max(1, ry));
  return new THREE.MeshStandardMaterial({map:t, roughness:0.95});
}
const merlons = [];
function wallSeg(parent, x1, z1, x2, z2, h, t, withMerlon){
  const w = Math.abs(x2 - x1) + (x1 === x2 ? t : 0), d = Math.abs(z2 - z1) + (z1 === z2 ? t : 0);
  const mx = (x1 + x2)/2, mz = (z1 + z2)/2;
  box(parent, w, h, d, brickMat(Math.max(w, d)/3.5, h/3.5), mx, h/2, mz);
  box(parent, w + 0.16, 0.16, d + 0.16, M(0x6f6658), mx, h + 0.08, mz, false);
  if(withMerlon !== false){
    const alongX = w > d, L = alongX ? w : d, n = Math.max(1, Math.floor(L/1.25));
    for(let i = 0; i < n; i++){
      const s = -L/2 + (i + 0.5)*(L/n);
      merlons.push(alongX ? [mx + s, h + 0.46, mz, 0.72, 0.6, t*0.7] : [mx, h + 0.46, mz + s, t*0.7, 0.6, 0.72]);
    }
  }
}
function finalizeMerlons(){
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), M(0x857b6a), merlons.length);
  const o = new THREE.Object3D();
  merlons.forEach((m, i) => { o.position.set(m[0], m[1], m[2]); o.scale.set(m[3], m[4], m[5]); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
  im.castShadow = true; im.receiveShadow = true;
  scene.add(im);
}

const roadCurves = [];
function distPts(x, z, pts){
  let best = 1e9;
  for(let i = 0; i < pts.length - 1; i++){
    const a = pts[i], b = pts[i + 1], abx = b.x - a.x, abz = b.z - a.z;
    const t = clamp(((x - a.x)*abx + (z - a.z)*abz)/((abx*abx + abz*abz) || 1), 0, 1);
    best = Math.min(best, Math.hypot(a.x + abx*t - x, a.z + abz*t - z));
  }
  return best;
}
const placedHouses = [];
function buildHouses(){
  const riverS = riverCurve.getSpacedPoints(180);
  const zones = [[-21,27,16],[21,28,16],[36,4,16],[36,-16,16],[-36,4,18],[-39,-20,17],[50,-42,25],[-66,22,19],[68,26,18],[64,-5,30],[-26,36,10],[34,36,8],[0,25.5,10]];
  const ok = (x, z) => {
    if(x > -21 && x < 21 && z > -33 && z < 19) return false;
    if(Math.hypot(x, z) > 74) return false;
    if(z < -26 || z > 80) return false;
    for(const q of zones) if(Math.hypot(x - q[0], z - q[1]) < q[2]) return false;
    if(distPts(x, z, riverS) < 10.5) return false;
    for(const r of roadCurves) if(distPts(x, z, r.pts) < r.w/2 + 4.4) return false;
    for(const h of placedHouses) if(Math.hypot(x - h[0], z - h[1]) < 9) return false;
    return true;
  };
  let n = 0;
  for(const rd of roadCurves){
    const len = rd.curve.getLength(), cnt = Math.floor(len/10.5);
    for(let i = 1; i < cnt; i++){
      const t = i/cnt, p = rd.curve.getPointAt(t), tg = rd.curve.getTangentAt(t);
      for(const side of [1, -1]){
        if(n > 34) break;
        const off = rd.w/2 + 5.8 + rnd()*1.4, nx = -tg.z*side, nz = tg.x*side;
        const x = p.x + nx*off + tg.x*(rnd() - 0.5)*2.4, z = p.z + nz*off + tg.z*(rnd() - 0.5)*2.4;
        if(!ok(x, z)) continue;
        house(x, z, Math.atan2(-nx, -nz), n % 3, n % 2 === 0);
        placedHouses.push([x, z]); AVOID.push([x, z, 6]);
        n++;
      }
    }
  }
  for(let tries = 0; tries < 160 && n < 40; tries++){
    const x = rr(-70, 70), z = rr(40, 76);
    if(!ok(x, z)) continue;
    let best = 1e9, bp = null;
    for(const rd of roadCurves){ for(const p of rd.pts){ const d = Math.hypot(p.x - x, p.z - z); if(d < best){ best = d; bp = p; } } }
    if(best > 20) continue;
    house(x, z, Math.atan2(bp.x - x, bp.z - z), n % 3, n % 2 === 0);
    placedHouses.push([x, z]); AVOID.push([x, z, 6]);
    n++;
  }
  placedHouses.forEach(h => {
    for(let k = 0; k < 2; k++){
      const a = rnd()*6.28, d = 4.6 + rnd()*2, x = h[0] + Math.cos(a)*d, z = h[1] + Math.sin(a)*d;
      let bad = distPts(x, z, riverS) < 7;
      for(const r of roadCurves) if(distPts(x, z, r.pts) < r.w/2 + 2.2) bad = true;
      for(const q of placedHouses) if(q !== h && Math.hypot(x - q[0], z - q[1]) < 4.2) bad = true;
      if(!bad) simpleTree(scene, x, z, 0.9 + rnd()*0.7);
    }
  });
}

const iconMatCache = {};
function iconMaterial(emoji){
  if(iconMatCache[emoji]) return iconMatCache[emoji];
  const c = document.createElement('canvas'); c.width = 96; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.88)'; g.beginPath(); g.arc(48, 46, 38, 0, 6.3); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.88)'; g.beginPath(); g.moveTo(40, 80); g.lineTo(48, 95); g.lineTo(56, 80); g.fill();
  g.font = '50px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(emoji, 48, 49);
  const tex = new THREE.CanvasTexture(c);
  return iconMatCache[emoji] = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
}
function setIcon(c, emoji){ const s = c.group.userData.iconSprite; if(!s) return; s.material = iconMaterial(emoji); s.visible = true; }
function clearIcon(c){ const s = c.group.userData.iconSprite; if(s) s.visible = false; }

function stepTowards(c, dt, t, speedMul){
  const pos = c.group.position;
  const dx = c.target.x - pos.x, dz = c.target.z - pos.z;
  const dist = Math.hypot(dx, dz);
  if(dist < 0.09) return true;
  const sp = 0.85*(speedMul || 1)*(c.speed || 1);
  const stepLen = Math.min(dist, sp*dt);
  pos.x += dx/dist*stepLen; pos.z += dz/dist*stepLen;
  pos.y = (c.baseY || 0) + groundHeight(pos.x, pos.z) + Math.abs(Math.sin(t*8*(speedMul > 1.4 ? 1.3 : 1) + (c.ph || 0)))*0.045;
  const want = Math.atan2(dx, dz);
  let diff = want - c.facing;
  while(diff > Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  c.facing += diff*Math.min(1, dt*8);
  c.group.rotation.y = c.facing;
  const arms = c.group.userData.arms, sw = speedMul > 1.4 ? 11 : 9;
  if(arms) arms.forEach((arm, i) => { arm.rotation.x = Math.sin(t*sw + i*Math.PI)*0.5; });
  const cr = c.group.userData.carry; if(cr) cr.rotation.z = Math.sin(t*8 + (c.ph || 0))*0.06;
  return false;
}
function faceToward(c, x, z){
  c.facing = Math.atan2(x - c.group.position.x, z - c.group.position.z);
  c.group.rotation.y = c.facing;
}
function idleBob(c, t){
  c.group.position.y = (c.baseY || 0) + groundHeight(c.group.position.x, c.group.position.z) + Math.sin(t*2.2 + (c.ph || 0))*0.015;
  const arms = c.group.userData.arms;
  if(arms) arms.forEach((arm, i) => { arm.rotation.x = Math.sin(t*1.4 + i + (c.ph || 0))*0.04; });
}
function pickNewTarget(c){
  const a = rnd()*Math.PI*2, r = (c.wMin || 0.9) + rnd()*((c.wMax || 2.7) - (c.wMin || 0.9));
  c.target.set(c.home.x + Math.sin(a)*r, 0, c.home.z + Math.cos(a)*r);
  c.state = 'walk';
}
function followRoute(c, dt, t, mul){
  if(c.routeIdx >= c.route.length) return true;
  const p = c.route[c.routeIdx];
  c.target.set(p[0], 0, p[1]);
  if(stepTowards(c, dt, t, mul)){ c.routeIdx++; return c.routeIdx >= c.route.length; }
  return false;
}

/* quan + vua */
function updateCharacter(c, dt, t){
  if(c.pendingClearIcon && t > c.pendingClearIcon){ clearIcon(c); c.pendingClearIcon = null; }
  switch(c.phase){
    case 'home':
      if(c.state === 'walk'){ if(stepTowards(c, dt, t)){ c.state = 'idle'; c.idleUntil = t + 2 + rnd()*4; } return; }
      idleBob(c, t);
      if(t > c.idleUntil){
        const r = rnd();
        if(r < 0.4) pickNewTarget(c);
        else if(r < 0.72){ setIcon(c, SIDE_ICONS[Math.floor(rnd()*SIDE_ICONS.length)]); c.idleUntil = t + 1.8 + rnd()*1.6; c.pendingClearIcon = c.idleUntil; }
        else c.idleUntil = t + 1 + rnd()*2;
      }
      return;
    case 'petition_go':
      if(stepTowards(c, dt, t, 1.15)){ c.phase = 'petition_wait'; c.phaseUntil = t + 3.4; setIcon(c, '📜'); const v = c.vuaRef; if(v){ faceToward(c, v.group.position.x, v.group.position.z); faceToward(v, c.group.position.x, c.group.position.z); setIcon(v, '✒️'); v.pendingClearIcon = t + 3.4; } }
      return;
    case 'petition_wait':
      c.group.position.y = Math.sin(t*3)*0.02;
      if(t > c.phaseUntil){ clearIcon(c); c.phase = 'petition_return'; c.target.set(c.home.x, 0, c.home.z); }
      return;
    case 'petition_return':
      if(stepTowards(c, dt, t)){ c.phase = 'home'; c.state = 'idle'; c.idleUntil = t + 1 + rnd()*2; }
      return;
    case 'meet_go':
      if(stepTowards(c, dt, t)){ c.phase = 'meet_wait'; c.phaseUntil = t + (c.meetDuration || 4); setIcon(c, '💬'); if(c.meetPartner) faceToward(c, c.meetPartner.group.position.x, c.meetPartner.group.position.z); }
      return;
    case 'meet_wait':
      idleBob(c, t);
      if(t > c.phaseUntil){ clearIcon(c); c.phase = 'meet_return'; c.target.set(c.home.x, 0, c.home.z); }
      return;
    case 'meet_return':
      if(stepTowards(c, dt, t)){ c.phase = 'home'; c.state = 'idle'; c.idleUntil = t + 1 + rnd()*2; }
      return;
    case 'trip_go':
      if(followRoute(c, dt, t, 2.3)){ c.phase = 'trip_wait'; c.phaseUntil = t + (c.trip.stay || 5); setIcon(c, c.trip.icon); }
      return;
    case 'trip_wait':
      idleBob(c, t);
      if(t > c.phaseUntil){ clearIcon(c); c.phase = 'trip_back'; c.route = c.route.slice().reverse(); c.routeIdx = 0; c.route.push([c.home.x, c.home.z]); }
      return;
    case 'trip_back':
      if(followRoute(c, dt, t, 2.3)){ c.phase = 'home'; c.state = 'idle'; c.idleUntil = t + 1 + rnd()*2; c.trip = null; }
      return;
  }
}

/* dân làng, lính, học trò */
function updateNpc(n, dt, t){
  if(n.pendingClearIcon && t > n.pendingClearIcon){ clearIcon(n); n.pendingClearIcon = null; }
  const maybeIcon = (p) => {
    if(n.icons && rnd() < p){ setIcon(n, n.icons[Math.floor(rnd()*n.icons.length)]); n.pendingClearIcon = t + 1.8 + rnd()*1.4; return true; }
    return false;
  };
  switch(n.mode){
    case 'wander':
      if(n.state === 'walk'){ if(stepTowards(n, dt, t)){ n.state = 'idle'; n.idleUntil = t + 1.5 + rnd()*4; } return; }
      idleBob(n, t);
      if(t > n.idleUntil){ if(rnd() < 0.62) pickNewTarget(n); else { maybeIcon(0.8); n.idleUntil = t + 2 + rnd()*2; } }
      return;
    case 'patrol':
    case 'commute':
      if(n.state === 'walk'){
        const p = n.route[n.routeIdx]; n.target.set(p[0], 0, p[1]);
        if(stepTowards(n, dt, t, n.mul || 1)){
          n.state = 'idle'; n.idleUntil = t + (n.mode === 'commute' ? 2 + rnd()*3 : 0.8 + rnd()*1.6);
          if(n.mode === 'commute'){ n.routeIdx += n.dir; if(n.routeIdx >= n.route.length){ n.routeIdx = n.route.length - 2; n.dir = -1; } else if(n.routeIdx < 0){ n.routeIdx = 1; n.dir = 1; } maybeIcon(0.7); }
          else { n.routeIdx = (n.routeIdx + 1) % n.route.length; }
        }
        return;
      }
      idleBob(n, t);
      if(t > n.idleUntil) n.state = 'walk';
      return;
    case 'stand':
      idleBob(n, t);
      n.group.rotation.y = n.facing0 + Math.sin(t*0.4 + n.ph)*0.35;
      if(t > n.idleUntil){ maybeIcon(0.4); n.idleUntil = t + 4 + rnd()*5; }
      return;
    case 'train': {
      const arms = n.group.userData.arms;
      n.group.position.y = (n.baseY || 0) + Math.abs(Math.sin(t*5 + n.ph))*0.03;
      if(arms){ arms[1].rotation.x = -1.3 + Math.sin(t*5 + n.ph)*0.9; arms[0].rotation.x = Math.sin(t*5 + n.ph + 1)*0.3; }
      if(t > n.idleUntil){ maybeIcon(0.3); n.idleUntil = t + 5 + rnd()*5; }
      return; }
    case 'perform': {
      const arms = n.group.userData.arms;
      n.group.position.y = (n.baseY || 0) + Math.abs(Math.sin(t*2.4 + n.ph))*0.05;
      if(arms){ arms[0].rotation.x = -0.9 + Math.sin(t*3 + n.ph)*0.5; arms[1].rotation.x = -0.9 + Math.sin(t*3 + n.ph + 2)*0.5; }
      if(t > n.idleUntil){ setIcon(n, '🎶'); n.pendingClearIcon = t + 2.2; n.idleUntil = t + 4 + rnd()*3; }
      return; }
  }
}

const limeCache = {};
function limeBase(){
  if(limeCache._base) return limeCache._base;
  limeCache._base = canvasTex(128, 128, (c, W, H) => {
    c.fillStyle = '#d6ccae'; c.fillRect(0, 0, W, H);
    for(let j = 0; j < 8; j++){
      const off = (j % 2)*16;
      for(let i = -1; i < 5; i++){
        const v = 0.9 + rnd()*0.2;
        c.fillStyle = 'rgb(' + Math.round(222*v) + ',' + Math.round(212*v) + ',' + Math.round(180*v) + ')';
        c.fillRect(i*32 + off + 1, j*16 + 1, 30, 14);
      }
    }
    c.strokeStyle = 'rgba(86,74,52,0.5)'; c.lineWidth = 1.4;
    for(let j = 0; j <= 8; j++){ c.beginPath(); c.moveTo(0, j*16); c.lineTo(W, j*16); c.stroke(); }
    for(let j = 0; j < 8; j++){ const off = (j % 2)*16; for(let i = -1; i < 5; i++){ c.beginPath(); c.moveTo(i*32 + off, j*16); c.lineTo(i*32 + off, j*16 + 16); c.stroke(); } }
  });
  return limeCache._base;
}
function limeMat(w, h){
  const k = Math.round(w/1.75) + 'x' + Math.round(h/1.1);
  if(limeCache[k]) return limeCache[k];
  const t = limeBase().clone(); t.needsUpdate = true; t.repeat.set(Math.max(1, w/3.5), Math.max(1, h/2.2));
  return limeCache[k] = new THREE.MeshStandardMaterial({map:t, roughness:0.92});
}
function limeSlab(){
  if(limeCache._slab) return limeCache._slab;
  const t = limeBase().clone(); t.needsUpdate = true; t.repeat.set(0.25, 0.45);
  return limeCache._slab = new THREE.MeshStandardMaterial({map:t, roughness:0.92});
}

/* ---------- camera / controls ---------- */
const cam = {pos:new V3(62, 52, 92), yaw:0, pitch:-0.4, vel:new V3()};
const keys = {};
let flight = null;
function lookFrom(pos, target){
  cam.pos.copy(pos);
  const d = target.clone().sub(pos);

  cam.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z));
}
function applyCam(){
  camera.position.copy(cam.pos);

  camera.rotation.set(cam.pitch, cam.yaw, 0);
}
function flyTo(pos, look){
  const target = new THREE.Object3D();
  const save = {p:cam.pos.clone(), y:cam.yaw, pi:cam.pitch};
  lookFrom(new V3(pos[0], pos[1], pos[2]), new V3(look[0], look[1], look[2]));
  const to = {p:cam.pos.clone(), y:cam.yaw, pi:cam.pitch};
  cam.pos.copy(save.p); cam.yaw = save.y; cam.pitch = save.pi;
  let dy = to.y - save.y;
  while(dy > Math.PI) dy -= Math.PI*2;
  while(dy < -Math.PI) dy += Math.PI*2;
  flight = {t0:null, dur:1.5 + Math.min(1.8, save.p.distanceTo(to.p)/90), from:save, to:to, dy:dy};
  cam.vel.set(0, 0, 0);
}
function updateFly(dt, t){
  if(flight){
    if(flight.t0 === null) flight.t0 = t;
    let k = (t - flight.t0)/flight.dur;
    if(k >= 1){ k = 1; }
    const e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2;
    cam.pos.lerpVectors(flight.from.p, flight.to.p, e);
    cam.pos.y += Math.sin(e*Math.PI)*8;
    cam.yaw = flight.from.y + flight.dy*e;
    cam.pitch = flight.from.pi + (flight.to.pi - flight.from.pi)*e;
    if(k >= 1) flight = null;
    return;
  }
  const f = new V3(-Math.sin(cam.yaw)*Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw)*Math.cos(cam.pitch));
  const r = new V3(Math.cos(cam.yaw), 0, -Math.sin(cam.yaw));
  const w = new V3();
  if(keys.KeyW || keys.ArrowUp) w.add(f);
  if(keys.KeyS || keys.ArrowDown) w.sub(f);
  if(keys.KeyD || keys.ArrowRight) w.add(r);
  if(keys.KeyA || keys.ArrowLeft) w.sub(r);
  if(keys.KeyE || keys.Space) w.y += 1;

  const boost = (keys.ShiftLeft || keys.ShiftRight) ? 3.2 : 1;
  const speed = (11 + cam.pos.y*0.5)*boost;
  if(w.lengthSq() > 0) w.normalize().multiplyScalar(speed);
  cam.vel.lerp(w, 1 - Math.exp(-dt*7));
  cam.pos.addScaledVector(cam.vel, dt);
  cam.pos.y = clamp(cam.pos.y, 1.0, 130);
  const hr = Math.hypot(cam.pos.x, cam.pos.z);

  const canvas = renderer.domElement, rect = canvas.getBoundingClientRect();

    const ob = h.object;
    if(ob.isSprite || ob.isPoints || ob.isLine) continue;
    if(!ob.userData.pickProxy){
      if(!chainVisible(ob)) continue;

/* ---------- scheduler ---------- */
let vuaChar = null, nextPetitionAt = 5, nextMeetingAt = 7, nextTripAt = 14, nextVuaTripAt = 40;
function schedule(t){
  if(t > nextPetitionAt){
    nextPetitionAt = t + 7 + rnd()*6;
    const pend = Array.from(new Set(congVu.filter(v => v.trang_thai === 'cho_duyet').map(v => v.bo_giao)));
    if(pend.length && vuaChar.phase === 'home'){
      const key = pend[Math.floor(rnd()*pend.length)];
      const c = characters.find(x => x.key === key && x.phase === 'home');
      if(c){ c.vuaRef = vuaChar; c.phase = 'petition_go'; c.target.set(vuaChar.group.position.x + (rnd() - 0.5)*1.2, 0, vuaChar.group.position.z + 1.9); }
    }
  }
  if(t > nextMeetingAt){
    nextMeetingAt = t + 9 + rnd()*7;
    const idle = characters.filter(c => c.phase === 'home' && c.state === 'idle' && !c.isVua);
    if(idle.length >= 2){
      const a = idle[Math.floor(rnd()*idle.length)], rest = idle.filter(c => c !== a), b = rest[Math.floor(rnd()*rest.length)];
      const mx = (a.home.x + b.home.x)/2, mz = (a.home.z + b.home.z)/2, dur = 4 + rnd()*2.5;
      a.phase = 'meet_go'; a.target.set(mx - 0.34, 0, mz); a.meetPartner = b; a.meetDuration = dur;
      b.phase = 'meet_go'; b.target.set(mx + 0.34, 0, mz); b.meetPartner = a; b.meetDuration = dur;
    }
  }
  if(t > nextTripAt){
    nextTripAt = t + 22 + rnd()*20;
    const out = characters.filter(c => c.phase.indexOf('trip') === 0).length;
    const idle = characters.filter(c => c.phase === 'home' && c.state === 'idle' && !c.isVua);
    if(out < 2 && idle.length){
      const c = idle[Math.floor(rnd()*idle.length)], trip = TRIPS[Math.floor(rnd()*TRIPS.length)];
      c.trip = trip; c.route = trip.route.map(p => p.slice()); c.routeIdx = 0; c.phase = 'trip_go';
    }
  }
  if(t > nextVuaTripAt){
    nextVuaTripAt = t + 50 + rnd()*40;
    if(vuaChar.phase === 'home'){
      vuaChar.trip = {name:'Hậu Cung', icon:'🍵', stay:7}; vuaChar.route = [[4,0],[10.6,0],[10.6,-13.95],[0,-13.95],[0,-17.6]]; vuaChar.routeIdx = 0; vuaChar.phase = 'trip_go';
    }
  }
}

    try { build(); } catch(e){ loading.querySelector('span').textContent = 'Không dựng được cảnh 3D: ' + e.message; console.error(e); return; }
    loading.style.display = 'none';
  }, 30);
}

function build(){
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xc9ddec, 70, 260);
  glowTex = radialTex([[0, 'rgba(255,255,255,1)'], [0.22, 'rgba(255,255,255,0.6)'], [1, 'rgba(255,255,255,0)']]);
  cloudTex = radialTex([[0, 'rgba(255,255,255,0.95)'], [0.5, 'rgba(255,255,255,0.5)'], [1, 'rgba(255,255,255,0)']]);
  smokeTex = radialTex([[0, 'rgba(210,210,210,0.85)'], [1, 'rgba(210,210,210,0)']]);
  camera = new THREE.PerspectiveCamera(60, 16/9, 0.3, 3000);
  renderer = new THREE.WebGLRenderer({canvas:canvasEl, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  resize();
  window.addEventListener('resize', resize);

  ambLight = new THREE.AmbientLight(0xffffff, 0.7); scene.add(ambLight);
  hemiLight = new THREE.HemisphereLight(0xbfd9ff, 0x6a7a4a, 0.55); scene.add(hemiLight);
  sunLight = new THREE.DirectionalLight(0xfff0d0, 1.2);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  const sc = sunLight.shadow.camera; sc.left = -46; sc.right = 46; sc.top = 46; sc.bottom = -46; sc.near = 1; sc.far = 260;
  sunLight.shadow.bias = -0.0006;
  sunLight.shadow.normalBias = 0.06;
  scene.add(sunLight); scene.add(sunLight.target);
  clock = new THREE.Clock();

  buildSky(); buildClouds(); buildBirds();
  buildTerrain();
  const hero = buildMountains();
  buildMist();
  buildRoads();
  buildRiver();
  buildWaterfall(hero);
  buildWaterWheel();
  buildDock();

  buildWalls();
  buildNgoMon();
  buildTamQuan();
  buildHall();
  buildHauCung();
  buildKyDai();
  const rowZ = [7.2, 2.4, -2.4];
  BO.forEach((b, i) => buildPavilionBo({x:(i % 2 === 0 ? -1 : 1)*6.8, z:rowZ[Math.floor(i/2)]}, b));
  [[-12.4,-8],[12.4,-8],[-12.4,5],[12.4,5],[-12.5,9.5],[12.5,9.5],[-12,-18],[12,-18]].forEach(p => simpleTree(scene, p[0], p[1], 1.2 + rnd()*0.4));
  [[-3.2,9.6],[3.2,9.6],[-3.2,-1.2],[3.2,-1.2]].forEach(p => lanternAt(scene, p[0], p[1], 1.5));

  buildDinh(); buildCho(); buildDoanhTrai(); buildKhoLuong(); buildHoaVien(); buildHocVien(); buildChua();
  buildTerraceHill(-66, 22, 15); buildTerraceHill(68, 26, 14);

  buildChurch(64, -5, -Math.PI/2, 0.58);
  buildBoard();
  buildHouses();
  banyan(scene, -10, 48, 1.5);
  [[-30,49],[30,49],[-62,56],[62,58]].forEach(p => bamboo(scene, p[0], p[1], 10));
  [[-14,-34],[14,-34],[0,-36],[-26,-32],[26,-32],[-8,-39],[8,-39]].forEach(p => simpleTree(scene, p[0], p[1], 1.3 + rnd()*0.6));
  buildDetails();
  buildSmoke(smokeEmitters);
  buildForest(AVOID);
  finalizeLabelsDefaults();

  // people
  QUAN.forEach(q => {
    const idx = BO.findIndex(b => b.key === q.key);
    const home = {x:(idx % 2 === 0 ? -1 : 1)*3.6, z:rowZ[Math.floor(idx/2)]};
    const grp = buildPerson({robe:DEPT_COLOR[q.key], hat:'canhchuon', hot:true});
    grp.userData.quanKey = q.key;
    const lab = makeLabelSprite(q.ten.split(' ').slice(-1)[0], DEPT_COLOR[q.key], true); lab.position.y = grp.userData.topY + 0.4; grp.add(lab); labels.push({s:lab, maxDist:42, child:true});
    grp.position.set(home.x, 0, home.z);
    scene.add(grp);
    const c = {group:grp, key:q.key, isVua:false, phase:'home', state:'idle', idleUntil:rr(0, 3), facing:0, target:new V3(), home:home, ph:rr(0, 6), pendingClearIcon:null, wMin:0.9, wMax:2.2};
    characters.push(c);
  });
  const vg = buildPerson({robe:0xb3202c, hat:'crown', vua:true, scale:1.18, hot:false});
  vg.userData.quanKey = 'vua';
  const vl = makeLabelSprite('Bệ Hạ', 0xd9a53f, true); vl.position.y = vg.userData.topY + 0.45; vg.add(vl); labels.push({s:vl, maxDist:48, child:true});
  vg.position.set(0, 0, -1.8); scene.add(vg);
  vuaChar = {group:vg, key:'vua', isVua:true, phase:'home', state:'idle', idleUntil:rr(0, 3), facing:0, target:new V3(), home:{x:0, z:-1.8}, ph:1.3, pendingClearIcon:null, wMin:0.8, wMax:2.4};
  characters.push(vuaChar);
  spawnPeople();

  selRing = new THREE.Mesh(new THREE.RingGeometry(0.88, 1.0, 48), new THREE.MeshBasicMaterial({color:0xffe08a, transparent:true, opacity:0.95, side:THREE.DoubleSide, depthTest:false}));
  selRing.rotation.x = -Math.PI/2; selRing.renderOrder = 12; selRing.visible = false; scene.add(selRing);

  mapCanvas = document.getElementById('san3d-map'); mapCtx = mapCanvas.getContext('2d');
  buildMapStatic();
  mapCanvas.addEventListener('click', e => {
    const r = mapCanvas.getBoundingClientRect(), mx = (e.clientX - r.left)/r.width*150, my = (e.clientY - r.top)/r.height*150;
    const x = (mx - 75)/MAP_S, z = (my - 75)/MAP_S;
    flyTo([x, 24, z + 22], [x, 0, z]);
  });

  setupUi();
  setTod('day');
  lookFrom(new V3(44, 36, 70), new V3(0, 0, -2));
  applyCam();
  updateTod(0, true);
  visible = true;
  frame();
}

function finalizeLabelsDefaults(){}

function setupUi(){
  const canvas = canvasEl;
  let drag = false, moved = false, lx = 0, ly = 0, lastHover = 0, travel = 0;
  canvas.addEventListener('pointerdown', e => { drag = true; moved = false; travel = 0; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); canvas.focus({preventScroll:true}); stopFlight(); });
  canvas.addEventListener('pointerup', e => { drag = false; });
  canvas.addEventListener('pointermove', e => {
    if(drag){
      const dx = e.clientX - lx, dy = e.clientY - ly;
      travel += Math.abs(dx) + Math.abs(dy); if(travel > 6) moved = true; else return;
      cam.yaw += dx*0.0045; cam.pitch = clamp(cam.pitch + dy*0.0045, -1.5, 1.5);
      lx = e.clientX; ly = e.clientY; tipEl.hidden = true;
      return;
    }
    const now = performance.now();
    if(now - lastHover < 90) return;
    lastHover = now;
    const o = pickAt(e.clientX, e.clientY);
    if(o){
      tipEl.textContent = nameOf(o); tipEl.hidden = false;
      const r = wrapEl.getBoundingClientRect();
      tipEl.style.left = (e.clientX - r.left + 14) + 'px'; tipEl.style.top = (e.clientY - r.top + 12) + 'px';
      canvas.style.cursor = 'pointer';
    } else { tipEl.hidden = true; canvas.style.cursor = 'grab'; }
  });
  canvas.addEventListener('pointerleave', () => { tipEl.hidden = true; });
  canvas.addEventListener('click', e => { if(moved) return; select(pickAt(e.clientX, e.clientY)); });
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); stopFlight();
    const f = new V3(-Math.sin(cam.yaw)*Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw)*Math.cos(cam.pitch));
    cam.pos.addScaledVector(f, -e.deltaY*0.03*(1 + cam.pos.y*0.06));
    cam.pos.y = clamp(cam.pos.y, 1.0, 130);
  }, {passive:false});
  window.addEventListener('keydown', e => {
    if(!visible) return;
    const tg = e.target && e.target.tagName;
    if(tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(/^(Key[WASDQEC]|Arrow(Up|Down|Left|Right)|Space|Shift(Left|Right))$/.test(e.code)){ keys[e.code] = true; stopFlight(); if(e.code.indexOf('Shift') < 0) e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { Object.keys(keys).forEach(k => keys[k] = false); });
  document.querySelectorAll('.san3d-pad button').forEach(b => {
    const code = b.dataset.key;
    const on = ev => { ev.preventDefault(); keys[code] = true; stopFlight(); }, off = () => { keys[code] = false; };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  });
  document.querySelectorAll('.san3d-tod button').forEach(b => b.addEventListener('click', () => setTod(b.dataset.tod)));
  const fs = document.getElementById('san3d-full');
  fs.addEventListener('click', () => {
    try {
      if(document.fullscreenElement) document.exitFullscreen();
      else if(wrapEl.requestFullscreen) wrapEl.requestFullscreen().catch(() => {});
    } catch(e){}
  });
  document.addEventListener('fullscreenchange', () => { setTimeout(resize, 80); });
  const pl = document.getElementById('san3d-places');
  pl.innerHTML = '';
  PLACES.forEach(p => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = p.ten;
    b.addEventListener('click', () => {
      flyTo(p.cam, p.look);
      if(p.key === 'toancanh'){ UI.close(); return; }
      const d = p.key === 'luc' ? {type:'tongquan'} : descForKey(p.key);
      UI.open(d); window.san3dApi.selectKey(d.type, d.key, true);
    });
    pl.appendChild(b);
  });
}

const tmpV = new V3();
let simT = 0;
function frame(){
  requestAnimationFrame(frame);
  if(!visible) return;
  step(Math.min(clock.getDelta(), 0.05));
}
function step(dt){
  simT += dt;
  const t = simT;
  updateFly(dt, t);
  applyCam();
  updateTod(dt);
  animators.forEach(a => a(t, dt));
  schedule(t);
  characters.forEach(c => updateCharacter(c, dt, t));
  npcs.forEach(n => updateNpc(n, dt, t));
  innerGroups.forEach(ig => { ig.root.getWorldPosition(tmpV); ig.g.visible = tmpV.distanceTo(cam.pos) < ig.d; });
  labels.forEach(l => {
    if(l.child) l.s.getWorldPosition(tmpV); else tmpV.copy(l.s.position);
    const d = tmpV.distanceTo(cam.pos);
    l.s.visible = d < l.maxDist*(l.child ? 1 : 1.9);
    if(l.s.visible){
      if(!l.base) l.base = l.s.scale.clone();
      const k = clamp(d/(l.child ? 16 : 40), 0.32, l.child ? 1.3 : 2.4);
      l.s.scale.set(l.base.x*k, l.base.y*k, 1);
    }
  });
  const fwd = new V3(-Math.sin(cam.yaw)*Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw)*Math.cos(cam.pitch));
  const focus = cam.pos.clone().addScaledVector(fwd, clamp(cam.pos.y*1.3 + 12, 18, 60));
  focus.y = 0;
  sunLight.target.position.copy(focus);
  sunLight.position.copy(focus).add(todCur.sunPos.clone().normalize().multiplyScalar(110));
  if(selected && selRing.visible){
    if(selCenter) selRing.position.copy(selCenter);
    else { selected.getWorldPosition(tmpV); selRing.position.set(tmpV.x, tmpV.y + 0.06, tmpV.z); }
    const pulse = 1 + Math.sin(t*4)*0.06; const r = selRing.userData.rad*pulse; selRing.scale.set(r, r, r);
  }
  drawMap(t);
  renderer.render(scene, camera);
}

window.initSan3D = init;
window.san3dOnData = function(){ if(typeof drawBoard === 'function') drawBoard(); };
window.san3dSetVisible = function(v){ visible = !!v && inited && !!renderer; if(v){ setTimeout(resize, 30); if(clock) clock.getDelta(); } };
window.san3dReady = true;
function sheet(views, cols){
  const sz = new THREE.Vector2(); renderer.getSize(sz);
  const rows = Math.ceil(views.length/cols), cw = Math.floor(sz.x/cols), ch = Math.floor(sz.y/rows);
  const sp = cam.pos.clone(), sy = cam.yaw, sPi = cam.pitch;
  renderer.setScissorTest(true);
  views.forEach((v, i) => {
    lookFrom(new V3(v[0], v[1], v[2]), new V3(v[3], v[4], v[5])); applyCam();
    camera.aspect = cw/ch; camera.updateProjectionMatrix();
    const cx = (i % cols)*cw, cy = sz.y - (Math.floor(i/cols) + 1)*ch;
    renderer.setViewport(cx, cy, cw, ch); renderer.setScissor(cx, cy, cw, ch);
    renderer.render(scene, camera);
  });
  renderer.setScissorTest(false); renderer.setViewport(0, 0, sz.x, sz.y);
  cam.pos.copy(sp); cam.yaw = sy; cam.pitch = sPi; applyCam();
  camera.aspect = sz.x/sz.y; camera.updateProjectionMatrix();
}
window.san3dDebug = {getScene:function(){ return scene; }, getRenderer:function(){ return renderer; }, sheet:sheet, step:step, snapTod:function(n){ setTod(n); updateTod(0, true); }, flyTo:flyTo, PLACES:PLACES, cam:cam, jump:function(p, l){ lookFrom(new V3(p[0], p[1], p[2]), new V3(l[0], l[1], l[2])); flight = null; }, setTod:setTod, characters:characters, npcs:npcs, select:select, pickAt:pickAt};
init();
})();
